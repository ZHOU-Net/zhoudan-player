            function drawWaveFrame(dataArray) {
                const canvas = waveCanvas;
                const coverEl = coverContainer;
                const wrapperEl = coverWrapper;
                const coverRect = coverEl.getBoundingClientRect();
                const wrapperRect = wrapperEl.getBoundingClientRect();
                const cx = coverRect.left - wrapperRect.left + coverRect.width / 2;
                const cy = coverRect.top - wrapperRect.top + coverRect.height / 2;
                const radius = coverRect.width / 2;
                const canvasSize = radius * 2 + 80;
                canvas.width = canvasSize;
                canvas.height = canvasSize;
                canvas.style.width = canvasSize + 'px';
                canvas.style.height = canvasSize + 'px';
                canvas.style.left = (wrapperRect.width / 2 - canvasSize / 2) + 'px';
                canvas.style.top = (wrapperRect.height / 2 - canvasSize / 2) + 'px';
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvasSize, canvasSize);
                const centerX = canvasSize / 2, centerY = canvasSize / 2;
                const barCount = 64;
                const innerR = radius + 6;
                const style = settings.waveStyle || 'style1';

                if (style === 'style1') {
                    const maxH = 32;
                    for (let i = 0; i < barCount; i++) {
                        const angle = (i / barCount) * Math.PI * 2 - Math.PI / 2;
                        const val = dataArray[i] || 128;
                        const n = (val - 128) / 128;
                        const h = Math.abs(n) * maxH + 2;
                        const sr = innerR, er = innerR + h;
                        const x1 = centerX + Math.cos(angle) * sr, y1 = centerY + Math.sin(angle) * sr;
                        const x2 = centerX + Math.cos(angle) * er, y2 = centerY + Math.sin(angle) * er;
                        const alpha = 0.3 + Math.abs(n) * 0.5;
                        ctx.beginPath();
                        ctx.moveTo(x1, y1);
                        ctx.lineTo(x2, y2);
                        ctx.strokeStyle = `hsla(${220 + n * 60},70%,65%,${alpha})`;
                        ctx.lineWidth = 2.5;
                        ctx.lineCap = 'round';
                        ctx.stroke();
                    }
                } else if (style === 'style2') {
                    const baseR = radius + 6;
                    const waveCount = 3;
                    for (let w = 0; w < waveCount; w++) {
                        const phaseOffset = (w / waveCount) * Math.PI * 2;
                        const points = 180;
                        ctx.beginPath();
                        for (let i = 0; i <= points; i++) {
                            const angle = (i / points) * Math.PI * 2;
                            const freqIndex = Math.floor((i / points) * barCount);
                            const val = dataArray[freqIndex] || 128;
                            const n = (val - 128) / 128;
                            const waveAmplitude = 4 + Math.abs(n) * 10;
                            const r = baseR + w * 8 + Math.sin(angle * 6 + phaseOffset) * waveAmplitude;
                            const x = centerX + Math.cos(angle) * r;
                            const y = centerY + Math.sin(angle) * r;
                            if (i === 0) ctx.moveTo(x, y);
                            else ctx.lineTo(x, y);
                        }
                        ctx.closePath();
                        const alpha = 0.4 + Math.abs((dataArray[Math.floor(w * 20)] || 128) - 128) / 128 * 0.3;
                        ctx.strokeStyle = `hsla(${200 + w * 40},70%,70%,${alpha})`;
                        ctx.lineWidth = 2;
                        ctx.lineCap = 'round';
                        ctx.stroke();
                    }
                } else if (style === 'style3') {
                    const barWidth = 5;
                    const maxH = 35;
                    for (let i = 0; i < barCount; i++) {
                        const angle = (i / barCount) * Math.PI * 2;
                        const val = dataArray[i] || 128;
                        const n = (val - 128) / 128;
                        const h = Math.abs(n) * maxH + 3;
                        const startR = radius + 2;
                        const endR = startR + h;
                        const x1 = centerX + Math.cos(angle) * startR;
                        const y1 = centerY + Math.sin(angle) * startR;
                        const x2 = centerX + Math.cos(angle) * endR;
                        const y2 = centerY + Math.sin(angle) * endR;
                        ctx.beginPath();
                        ctx.moveTo(x1, y1);
                        ctx.lineTo(x2, y2);
                        ctx.strokeStyle = `hsl(${180 + n * 100},60%,${50 + Math.abs(n) * 20}%)`;
                        ctx.lineWidth = barWidth;
                        ctx.lineCap = 'round';
                        ctx.stroke();
                    }
                } else if (style === 'style4') {
                    const bands = [
                        { start: 0, end: 10, baseR: radius + 2, color: '180, 80%' },
                        { start: 10, end: 30, baseR: radius + 10, color: '250, 70%' },
                        { start: 30, end: 63, baseR: radius + 18, color: '320, 70%' }
                    ];
                    bands.forEach(band => {
                        let sum = 0, count = 0;
                        for (let i = band.start; i <= band.end; i++) {
                            sum += dataArray[i] || 128;
                            count++;
                        }
                        const avg = sum / count;
                        const intensity = (avg - 128) / 128;
                        const lineWidth = Math.abs(intensity) * 8 + 1;
                        ctx.beginPath();
                        ctx.arc(centerX, centerY, band.baseR, 0, Math.PI * 2);
                        ctx.strokeStyle = `hsla(${band.color},${40 + Math.abs(intensity) * 40}%,${0.3 + Math.abs(intensity) * 0.5})`;
                        ctx.lineWidth = lineWidth;
                        ctx.stroke();
                    });
                } else if (style === 'style5') {
                    let totalEnergy = 0;
                    for (let i = 0; i < dataArray.length; i++) {
                        totalEnergy += (dataArray[i] - 128) * (dataArray[i] - 128);
                    }
                    const rms = Math.sqrt(totalEnergy / dataArray.length) / 128;
                    const circleCount = 5;
                    for (let i = 0; i < circleCount; i++) {
                        const baseRadius = radius + i * 6;
                        const currentRadius = baseRadius * (1 + (rms * 0.15));
                        ctx.beginPath();
                        ctx.arc(centerX, centerY, currentRadius, 0, Math.PI * 2);
                        ctx.strokeStyle = `rgba(255, 255, 255, ${0.25 + rms * 0.35})`;
                        ctx.lineWidth = 1.5;
                        ctx.stroke();
                    }
                }
            }

                const cf=editCoverFile.files[0]; if(cf) { const r=new FileReader(); r.onload=function(ev){ s.coverBase64=ev.target.result; finishEdit(); }; r.readAsDataURL(cf); } else finishEdit(); });
            function finishEdit() { savePlaylist(); if(editingSongIndex===currentIndex) { loadSong(currentIndex, false); if(isPlaying && audioEl) audioEl.play().catch(()=>{}); } renderPlaylist(); closeEditModal(); showToast('✅ 信息已更新'); }

            document.addEventListener('keydown', (e)=>{ if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return; switch(e.code) { case'Space': e.preventDefault(); togglePlay(); break; case'ArrowLeft': e.preventDefault(); if(audioEl) audioEl.currentTime=Math.max(0,audioEl.currentTime-5); break; case'ArrowRight': e.preventDefault(); if(audioEl) audioEl.currentTime=Math.min(audioEl.duration||0,audioEl.currentTime+5); break; case'ArrowUp': e.preventDefault(); volumeValue=Math.min(100,volumeValue+5); isMuted=false; updateVolumeUI(); saveSettings(); break; case'ArrowDown': e.preventDefault(); volumeValue=Math.max(0,volumeValue-5); if(volumeValue===0) isMuted=true; updateVolumeUI(); saveSettings(); break; case'KeyM': if(!e.ctrlKey) { e.preventDefault(); toggleMute(); } break; case'KeyL': if(e.ctrlKey||e.metaKey) { e.preventDefault(); cyclePlayMode(); } break; } });
            window.addEventListener('resize', () => updateLyricDisplay(false));

            async function init() { loadSettings(); await openDB(); loadPlaylist(); applySettings(); updatePlayPauseIcon(); updatePlayModeIcon(); updateVolumeUI(); if(audioEl) audioEl.volume=isMuted?0:volumeValue/100; drawWaveFrame(new Uint8Array(64).fill(128)); if(currentIndex>=0) loadSong(currentIndex, false); startWaveAnimation(); }
            init().catch(err=>console.error('初始化失败',err));
            window.addEventListener('beforeunload', ()=>{ saveSettings(); savePlaylist(); if(audioEl?.src?.startsWith('blob:')) URL.revokeObjectURL(audioEl.src); });
        })();
    </script>
</body>
</html>
